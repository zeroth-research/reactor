metrics:
  - id: metric_completed_jobs
    name: Completed jobs
    description: Total jobs completed across all three routes.
    code: return state.places.CompletedAB.count + state.places.CompletedBC.count + state.places.CompletedCA.count;
  - id: metric_open_jobs
    name: Open jobs
    description: Waiting or in-process jobs. A successful maximal run ends at zero.
    code: return state.places.OrderAB.count + state.places.OrderBC.count + state.places.OrderCA.count + state.places.ABHoldingA.count + state.places.BCHoldingB.count + state.places.CAHoldingC.count;
  - id: metric_deadlocked
    name: Unfinished deadlock
    description: One exactly when all resources are held while unfinished work remains.
    code: |-
      const openJobs = state.places.OrderAB.count + state.places.OrderBC.count + state.places.OrderCA.count + state.places.ABHoldingA.count + state.places.BCHoldingB.count + state.places.CAHoldingC.count;
      const freeMachines = state.places.MachineAFree.count + state.places.MachineBFree.count + state.places.MachineCFree.count;
      return openJobs > 0 && freeMachines === 0 ? 1 : 0;
scenarios:
