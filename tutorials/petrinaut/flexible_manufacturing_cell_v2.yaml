  - id: scenario_one_order_each
    name: Dispatch credits with one order per product
    description: 'One order of every product family, one token for each machine, and the dispatch_credits scenario parameter (default 3) setting the initial DispatchCredits tokens. The wave size stays 3 because arc weights are fixed: with fewer than 3 credits the first wave never opens and nothing completes; with more than 3, several waves of dispatches can be in flight before processing starts and work in progress is bounded by the credit count instead of 3. Exact analysis: 2 credits is unwinnable; 3 credits gives 1,009 reachable states, 34 of 41 first waves safe, 8.0% losing; 4 and 5 credits stay winnable at 12.2% and 13.7% losing; 6 or more behaves as 5. In the engine''s default firing order the 3-credit run dispatches frame via cutter, panel via mill and cabinet via paint booth, the unsafe first wave from the curriculum text, and deadlocks.'
