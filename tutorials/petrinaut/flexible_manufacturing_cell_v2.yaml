metrics:
  - id: metric_completed_orders
    name: Completed orders
    description: Total completed orders across all product families.
    code: return state.places.CompletedFrames.count + state.places.CompletedPanels.count + state.places.CompletedCabinets.count + state.places.CompletedSensors.count + state.places.CompletedCircuitBoards.count + state.places.CompletedPumps.count;
  - id: metric_weighted_completion_score
    name: Weighted completion score
    description: A training objective for fixed-length episodes. Higher weights represent more valuable downstream orders.
    code: return 2 * state.places.CompletedFrames.count + 3 * state.places.CompletedPanels.count + 4 * state.places.CompletedCabinets.count + 5 * state.places.CompletedSensors.count + 6 * state.places.CompletedCircuitBoards.count + 5 * state.places.CompletedPumps.count;
  - id: metric_open_orders
    name: Open orders
    description: All waiting and in-process orders. A successful maximal run ends at zero.
    code: return state.places.FrameOrders.count + state.places.PanelOrders.count + state.places.CabinetOrders.count + state.places.SensorOrders.count + state.places.CircuitBoardOrders.count + state.places.PumpOrders.count + state.places.FrameHoldingCutter.count + state.places.PanelHoldingMill.count + state.places.PanelHoldingTestRig.count + state.places.CabinetHoldingPaintBooth.count + state.places.CabinetHoldingPackCell.count + state.places.SensorHoldingPaintBooth.count + state.places.CircuitBoardHoldingTestRig.count + state.places.PumpHoldingPackCell.count + state.places.PumpHoldingMill.count;
  - id: metric_machines_in_use
    name: Machines in use
    description: Five minus the number of free resource tokens. Useful as a utilization signal, but unsafe to maximize greedily.
    code: return 5 - state.places.CutterFree.count - state.places.MillFree.count - state.places.PaintBoothFree.count - state.places.TestRigFree.count - state.places.PackCellFree.count;
  - id: metric_unfinished_deadlock
    name: Unfinished deadlock
    description: One exactly when work remains but no dispatch, wave-release, or completion transition is enabled.
    code: |-
      const openOrders = state.places.FrameOrders.count + state.places.PanelOrders.count + state.places.CabinetOrders.count + state.places.SensorOrders.count + state.places.CircuitBoardOrders.count + state.places.PumpOrders.count + state.places.FrameHoldingCutter.count + state.places.PanelHoldingMill.count + state.places.PanelHoldingTestRig.count + state.places.CabinetHoldingPaintBooth.count + state.places.CabinetHoldingPackCell.count + state.places.SensorHoldingPaintBooth.count + state.places.CircuitBoardHoldingTestRig.count + state.places.PumpHoldingPackCell.count + state.places.PumpHoldingMill.count;
      const hasDispatchCredit = state.places.DispatchCredits.count > 0;
      const dispatchEnabled = hasDispatchCredit && ((state.places.FrameOrders.count > 0 && state.places.CutterFree.count > 0) || (state.places.PanelOrders.count > 0 && (state.places.MillFree.count > 0 || state.places.TestRigFree.count > 0)) || (state.places.CabinetOrders.count > 0 && (state.places.PaintBoothFree.count > 0 || state.places.PackCellFree.count > 0)) || (state.places.SensorOrders.count > 0 && state.places.PaintBoothFree.count > 0) || (state.places.CircuitBoardOrders.count > 0 && state.places.TestRigFree.count > 0) || (state.places.PumpOrders.count > 0 && (state.places.PackCellFree.count > 0 || state.places.MillFree.count > 0)));
      const waveReleaseEnabled = state.places.StartedInWave.count >= 3;
      const hasProcessingPermit = state.places.ProcessingPermits.count > 0;
      const completionEnabled = hasProcessingPermit && ((state.places.FrameHoldingCutter.count > 0 && state.places.MillFree.count > 0) || (state.places.PanelHoldingMill.count > 0 && state.places.PaintBoothFree.count > 0) || (state.places.PanelHoldingTestRig.count > 0 && state.places.PaintBoothFree.count > 0) || (state.places.CabinetHoldingPaintBooth.count > 0 && state.places.CutterFree.count > 0) || (state.places.CabinetHoldingPackCell.count > 0 && state.places.CutterFree.count > 0) || (state.places.SensorHoldingPaintBooth.count > 0 && state.places.TestRigFree.count > 0) || (state.places.CircuitBoardHoldingTestRig.count > 0 && state.places.PackCellFree.count > 0) || (state.places.PumpHoldingPackCell.count > 0 && state.places.PaintBoothFree.count > 0) || (state.places.PumpHoldingMill.count > 0 && state.places.PaintBoothFree.count > 0));
      return openOrders > 0 && !dispatchEnabled && !waveReleaseEnabled && !completionEnabled ? 1 : 0;
