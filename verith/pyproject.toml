[project]
name = "verith"
version = "0.1.0"
description = "Inferring certificates for reactive modules: the --infer routes, and the `verith` and `certify` commands"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    # `reactor.lean`: the module, its SMT encoding and the Lean project
    # every route is built on.
    "reactor",
    "cvc5>=1.3.2",
    "z3-solver>=4.12",
    # `nuterm`: the learner `--infer nuterm` trains.
    "numpy>=1.26",
    "torch==2.15.0",
]

[project.optional-dependencies]
# The LLM routes (`--infer ai`, `--infer ai-cegis`).
# Install with: pip install verith[ai]  or  uv pip install verith[ai]
# For local LLMs (Ollama, vLLM, etc.) via OpenAI-compatible API: pip install verith[ai-local]
ai = [
    "anthropic>=0.52",
]
ai-local = [
    "openai>=1.0",
]

[project.scripts]
# Inference alone: a module and a claim in, the certificate printed.
verith = "verith.cli:main"
# `reactor` and `verith` in one run: the project, with the certificate inferred.
certify = "certify:main"

[tool.uv.sources]
reactor = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["verith", "certify", "nuterm"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests", "nuterm/tests"]
addopts = "--import-mode=importlib"
markers = [
    "slow: marks tests that require lake + mathlib (deselect with '-m \"not slow\"')",
]
