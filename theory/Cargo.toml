[package]
name = "theory"
version = "0.1.0"
edition = "2024"

[dependencies]
base = { path = "../base" }
pyo3 = { version = "0.24", optional = true }
tch = { version = "0.22", optional = true }
pyo3-tch = { version = "0.22", optional = true }
subenum = "1.2.0"
derive_more = { version = "2.1.1", features = ["display", "from"] }

[features]
# `pyo3` makes the sorts and operations Python classes, with tensors held in
# Rust, from and into lists of rows.
# `torch` and `jax` add the tensors of their backends, which convert from and
# into `torch.Tensor` and `jax.Array`; `torch` links libtorch. Both require
# `pyo3`, and are kept separate so that either may be left out.
pyo3 = ["dep:pyo3"]
torch = ["pyo3", "dep:tch", "dep:pyo3-tch"]
jax = ["pyo3"]
