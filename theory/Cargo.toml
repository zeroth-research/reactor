[package]
name = "theory"
version = "0.1.0"
edition = "2024"

[dependencies]
base = { path = "../base" }
pyo3 = { version = "0.30.1", optional = true }
cfg_eval = { version = "0.1.2", features = ["items"], optional = true }
tch = { version = "0.27", optional = true }
pyo3-tch = { version = "0.27", optional = true }
subenum = "1.2.0"
derive_more = { version = "2.1.1", features = ["from"] }

[features]
# `pyo3` builds the Python bindings. Their `#[pymethods]` blocks are also the
# Rust API, so they stay compiled without it, their pyo3 attributes behind
# `cfg_attr`: `cfg_eval` expands those before `#[pymethods]` reads them.
pyo3 = ["dep:pyo3", "dep:cfg_eval"]
# `torch` adds the `tch::Tensor` backing of `matrix` (the `torch`
# module), which links libtorch and needs the bindings.
torch = ["pyo3", "dep:tch", "dep:pyo3-tch"]
