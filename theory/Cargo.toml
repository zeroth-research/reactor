[package]
name = "theory"
version = "0.1.0"
edition = "2024"

[dependencies]
base = { path = "../base" }
pyo3 = { version = "0.24", optional = true }
tch = { version = "0.22", optional = true }
pyo3-tch = { version = "0.22", optional = true }
subenum = "1.2.0"
derive_more = { version = "2.1.1", features = ["display", "from"] }

[features]
# `pyo3` makes the sorts and operations Python classes, with tensors held in
# Rust, from and into lists of rows.
# `torch` adds the torch tensors, which convert from and into `torch.Tensor`,
# and links libtorch. It requires `pyo3`, and is kept separate so that the
# Python bindings may leave torch out.
pyo3 = ["dep:pyo3"]
torch = ["pyo3", "dep:tch", "dep:pyo3-tch"]
