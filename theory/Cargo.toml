[package]
name = "theory"
version = "0.1.0"
edition = "2024"

[dependencies]
base = { path = "../base" }
pyo3 = "0.24"
tch = { version = "0.22", optional = true }
pyo3-tch = { version = "0.22", optional = true }
subenum = "1.2.0"
derive_more = { version = "2.1.1", features = ["from"] }

[features]
# The Python bindings, via pyo3, are always built. `torch` adds the
# `tch::Tensor` backing of `tensor` (the `torch` module), which links libtorch.
torch = ["dep:tch", "dep:pyo3-tch"]
