 name = "ZerothHammerTests"
 version = "0.1.0"
 defaultTargets = ["ZerothHammerTests", "ZerothHammer", "Certs", "ManualTests", "Playground"]

 # Generated: standalone zeroth_hammer tactic (no module-specific macros)
 [[lean_lib]]
 name = "ZerothHammer"

 # Generated: self-contained certificate proofs (one per module, inline init/update)
 [[lean_lib]]
 name = "Certs"

 # Manually written: test zeroth_hammer on standalone goal shapes, and pin
 # the semantics of Relational.Mat definitions that no certificate exercises
 [[lean_lib]]
 name = "ManualTests"
 roots = ["ManualTests.Basic", "ManualTests.Argmax", "ManualTests.Reduce"]

 [[lean_lib]]
 name = "ZerothHammerTests"
 roots = ["ZerothHammerTests"]

 # Playground: interactive scratchpad + proof-pattern regression tests
 [[lean_lib]]
 name = "Playground"
 roots = ["Playground"]

 [[require]]
 name = "cslib"
 scope = "leanprover"
 rev = "v4.28.0"

 # `Relational.*`, from the reactor-lean checkout beside this repository.
 [[require]]
 name = "Relational"
 path = "../../../../reactor-lean/Relational"
