name = "ReactorLeanTests"
version = "0.1.0"
defaultTargets = ["ManualTests"]

# Generated by `conftest.py`: the encodings of the test modules, and the
# scalar Argmax variants. Not a default target: there is no root
# `Certs.lean`, and there cannot be one -- the encodings of different
# modules declare the same names -- so each is built as a module of its own
# (`lake build Certs.<Name>`).
[[lean_lib]]
name = "Certs"

# Manually written: pin the semantics of Relational.Mat definitions that no
# generated file exercises
[[lean_lib]]
name = "ManualTests"
roots = ["ManualTests.Argmax", "ManualTests.Reduce"]

[[require]]
name = "cslib"
scope = "leanprover"
rev = "v4.34.0"

# `Relational.*` and `Spec.*`: `.lake/ReactLib` is a link to the `ReactLib`
# package of the checkout `$REACTLIB`, which the tests make (`lake.py`).
[[require]]
name = "ReactLib"
path = ".lake/ReactLib"
