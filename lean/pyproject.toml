[project]
name = "reactor-lean"
version = "0.1.0"
description = "Reactive modules to Lean 4: the module's encodings and its certificate project (the `reactor` command)"
readme = "python/reactor_lean/README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    # The reactive module, its IR and the native extension.
    "reactor",
    # The Lean project's files are rendered from templates.
    "jinja2>=3.1",
    # The constants of the terms the predicate parser builds (`parse`).
    "torch==2.15.0",
]

[project.scripts]
# A reactive module in, a Lean certificate project out.
reactor = "reactor_lean.cli:main"

[tool.uv.sources]
reactor = { workspace = true }

# Pure Python for now. Once this crate has pyo3 code, it builds with maturin
# like `../python`, from `python-source = "python"`.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/reactor_lean"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `tests/` is no package: its helpers (`agree`, `reactor_cli`) are imported
# from it by name.
pythonpath = ["tests"]
addopts = "--import-mode=importlib"
markers = [
    "slow: marks tests that require lake + mathlib (deselect with '-m \"not slow\"')",
]
